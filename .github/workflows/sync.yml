name: Import Throne source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: throne-source-import
  cancel-in-progress: false

jobs:
  import-source:
    name: Replace repository tree with pinned Throne source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import complete upstream source tree
        env:
          SOURCE_COMMIT: "e57a18f2f51137b3da3f789dd336fe5b1062222c"
        run: |
          set -euo pipefail
          git clone https://github.com/throneproj/ThroneForAndroid.git "$RUNNER_TEMP/throne"
          git -C "$RUNNER_TEMP/throne" checkout --detach "$SOURCE_COMMIT"
          if [ -f "$RUNNER_TEMP/throne/.gitmodules" ]; then
            git -C "$RUNNER_TEMP/throne" submodule update --init --recursive
          fi

          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/throne/" "$GITHUB_WORKSPACE/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Target tree already matches the pinned upstream source."
            exit 0
          fi
          git commit -m "Import complete Throne for Android source (\${SOURCE_COMMIT})"
          git push origin HEAD:main

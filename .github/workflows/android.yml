name: Android Release Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abo-vpn-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust 1.90
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Test tun2proxy core
        run: cargo test --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features

      - name: Check Rust engine for Android ABIs
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo check --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features --features udpgw --target aarch64-linux-android
          cargo check --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features --features udpgw --target armv7-linux-androideabi
          cargo check --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features --features udpgw --target x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Build tun2proxy for Android ABIs
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang" cargo build --manifest-path native/tun2proxy/Cargo.toml --lib --release --no-default-features --features udpgw --target aarch64-linux-android
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang" cargo build --manifest-path native/tun2proxy/Cargo.toml --lib --release --no-default-features --features udpgw --target armv7-linux-androideabi
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang" cargo build --manifest-path native/tun2proxy/Cargo.toml --lib --release --no-default-features --features udpgw --target x86_64-linux-android

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        run: gradle -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=0.1.${{ github.run_number }} :app:testReleaseUnitTest :app:assembleRelease

      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aboezzat-release.p12"
          test -s "$RUNNER_TEMP/aboezzat-release.p12"
          echo "Decoded keystore size: $(wc -c < "$RUNNER_TEMP/aboezzat-release.p12") bytes"
          echo "Keystore header (first 4 bytes): $(od -An -tx1 -N4 "$RUNNER_TEMP/aboezzat-release.p12" | tr -d ' \n')"
          keytool -list -keystore "$RUNNER_TEMP/aboezzat-release.p12" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
          echo "Keystore format, password, and alias validated."

      - name: Align and sign Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks-type PKCS12 --ks "$RUNNER_TEMP/aboezzat-release.p12" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Name signed Release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AboEzzat-VPN.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-VPN-Release
          path: app/build/outputs/apk/release/AboEzzat-VPN.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: AboEzzat VPN v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            versionCode: ${{ github.run_number }}

            Signed Android Release APK. Install from the app's built-in updater.
          files: app/build/outputs/apk/release/AboEzzat-VPN.apk

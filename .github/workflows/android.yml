name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abo-vpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust 1.90
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Test vendored tun2proxy core
        run: |
          cargo test --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features

      - name: Check Rust engine for Android ABIs
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo check --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features --features udpgw --target aarch64-linux-android
          cargo check --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features --features udpgw --target armv7-linux-androideabi
          cargo check --manifest-path native/tun2proxy/Cargo.toml --lib --no-default-features --features udpgw --target x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Build patched tun2proxy for Android ABIs
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang" cargo build --manifest-path native/tun2proxy/Cargo.toml --lib --release --no-default-features --features udpgw --target aarch64-linux-android
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang" cargo build --manifest-path native/tun2proxy/Cargo.toml --lib --release --no-default-features --features udpgw --target armv7-linux-androideabi
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang" cargo build --manifest-path native/tun2proxy/Cargo.toml --lib --release --no-default-features --features udpgw --target x86_64-linux-android

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
